<form class="space-y-5">

<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant ml-1" for="full_name">Full Name</label>
<input class="w-full px-4 py-3 bg-slate-50 border-none ring-1 ring-outline-variant/10 focus:ring-2 focus:ring-primary-container/30 focus:bg-primary-fixed/5 transition-all outline-none text-on-surface placeholder:text-outline/50 rounded-[12px]" id="full_name" name="full_name" placeholder="John Doe" type="text"/>
</div>
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant ml-1" for="email">Email</label>
<input class="w-full px-4 py-3 bg-slate-50 border-none ring-1 ring-outline-variant/10 focus:ring-2 focus:ring-primary-container/30 focus:bg-primary-fixed/5 transition-all outline-none text-on-surface placeholder:text-outline/50 rounded-[12px]" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative">
<input class="w-full px-4 py-3 bg-slate-50 border-none ring-1 ring-outline-variant/10 focus:ring-2 focus:ring-primary-container/30 focus:bg-primary-fixed/5 transition-all outline-none text-on-surface placeholder:text-outline/50 rounded-[12px]" id="password" name="password" placeholder="••••••••" type="password"/>

<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>

                    Create account
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>

<div class="absolute inset-0 flex items-center">
