<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-primary": "#ffffff",
            "outline-variant": "#bbcac6",
            "secondary-fixed-dim": "#bec6e0",
            "on-error-container": "#93000a",
            "secondary-fixed": "#dae2fd",
            "on-secondary-fixed-variant": "#3f465c",
            "tertiary-fixed-dim": "#b7c8e1",
            "on-tertiary-fixed-variant": "#38485d",
            "tertiary-fixed": "#d3e4fe",
            "surface-container-lowest": "#ffffff",
            "on-tertiary": "#ffffff",
            "surface-container": "#e9efee",
            "surface": "#f5fbfa",
            "on-primary-container": "#00423b",
            "on-error": "#ffffff",
            "inverse-surface": "#2b3231",
            "surface-bright": "#f5fbfa",
            "on-secondary-fixed": "#131b2e",
            "on-tertiary-container": "#2b3b50",
            "surface-variant": "#dee4e3",
            "tertiary": "#505f76",
            "on-primary-fixed-variant": "#005048",
            "surface-container-highest": "#dee4e3",
            "primary-fixed": "#71f8e4",
            "inverse-primary": "#4fdbc8",
            "secondary-container": "#dae2fd",
            "secondary": "#565e74",
            "on-tertiary-fixed": "#0b1c30",
            "primary-container": "#14b8a6",
            "surface-container-low": "#eff5f4",
            "surface-container-high": "#e3e9e8",
            "outline": "#6c7a77",
            "on-surface-variant": "#3c4947",
            "surface-tint": "#006b5f",
            "error": "#ba1a1a",
            "background": "#f5fbfa",
            "primary-fixed-dim": "#4fdbc8",
            "on-surface": "#171d1c",
            "on-secondary": "#ffffff",
            "on-primary-fixed": "#00201c",
            "primary": "#006b5f",
            "surface-dim": "#d5dbda",
            "on-background": "#171d1c",
            "inverse-on-surface": "#ecf2f1",
            "tertiary-container": "#95a5be",
            "on-secondary-container": "#5c647a",
            "error-container": "#ffdad6"
          },
          fontFamily: {
            "headline": ["Inter"],
            "body": ["Inter"],
            "label": ["Inter"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
    }
    .ambient-shadow {
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03), 0 2px 4px rgba(15, 23, 42, 0.02);
    }
    .intelligence-ray {
      position: relative;
    }
    .intelligence-ray::before {
      content: '';
      position: absolute;
      left: 0;
      top: 15%;
      height: 70%;
      width: 2px;
      background-color: #14b8a6;
    }
    /* Targeted teal tint for the question card */
    .question-card-bg {
      background-color: #F0F9F8;
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col overflow-x-hidden">
<!-- Top Navigation (Shell Implementation) -->
<nav class="w-full top-0 sticky bg-background/95 backdrop-blur-sm z-50">
<div class="flex justify-between items-center px-6 py-4 max-w-3xl mx-auto">
<div class="text-base font-semibold text-on-surface">Onboarding</div>
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-low p-1.5 rounded-full transition-colors active:scale-95 text-[20px]">
          help
        </button>
</div>
</div>
<div class="bg-surface-container-high h-px w-full max-w-3xl mx-auto"></div>
</nav>
<!-- Main Canvas Content - Reduced vertical padding to make it more compact -->
<main class="flex-grow flex flex-col items-center px-6 py-12 md:py-20 max-w-3xl mx-auto w-full">
<!-- Progress Indicator -->
<div class="text-center w-full max-w-[240px] mx-auto mb-6">
<span class="font-label text-[10px] font-bold tracking-[0.15em] uppercase text-on-surface-variant block mb-3">Step 4 of 4</span>
<div class="h-1 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full w-full bg-primary rounded-full transition-all duration-700"></div>
</div>
</div>
<!-- Hero Question - Slightly smaller font -->
<div class="text-center">
<h1 class="font-headline text-2xl md:text-4xl font-semibold tracking-tight text-on-surface mb-4">What are you trying to achieve?</h1>
<p class="text-on-surface-variant text-sm md:text-base max-w-md mx-auto leading-relaxed">Select your primary financial objective to help us tailor your institutional dashboard.</p>
</div>
<!-- Main Question Card Area with subtle teal tint and refined padding -->
<div class="w-full question-card-bg rounded-[1.5rem] p-4 md:p-8 border border-outline-variant/20 shadow-sm">
<!-- Selection Grid -->
<div class="w-full grid gap-4">
<!-- Option 1: Save money -->
<button class="group relative flex items-center text-left p-4 md:p-6 rounded-xl border border-transparent hover:bg-surface-container-lowest hover:border-primary/20 ambient-shadow transition-all duration-300 bg-surface-container-lowest focus:ring-2 focus:ring-primary/40 focus:outline-none intelligence-ray">
<div class="bg-surface-container-highest p-3 rounded-lg mr-5 group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-primary text-[22px]" data-icon="savings">savings</span>
</div>
<div class="flex-grow">
<h3 class="font-headline font-semibold text-on-surface text-base">Save money</h3>
<p class="text-on-surface-variant text-xs mt-0.5">Build a robust safety net and grow your long-term capital.</p>
</div>
<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 text-primary transition-opacity text-[20px]" data-icon="check_circle">check_circle</span>
</button>
<!-- Option 2: Reduce expenses (Selected State) -->
<button class="group relative flex items-center text-left p-4 md:p-6 rounded-xl border-2 border-primary ambient-shadow transition-all duration-300 bg-surface-container-lowest focus:ring-2 focus:ring-primary/40 focus:outline-none intelligence-ray shadow-lg shadow-primary/5">
<div class="bg-primary/10 p-3 rounded-lg mr-5">
<span class="material-symbols-outlined text-primary text-[22px]" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<div class="flex-grow">
<h3 class="font-headline font-semibold text-on-surface text-base">Reduce expenses</h3>
<p class="text-on-surface-variant text-xs mt-0.5">Identify inefficiencies and optimize your recurring overhead.</p>
</div>
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option 3: Manage spending better -->
<button class="group relative flex items-center text-left p-4 md:p-6 rounded-xl border border-transparent hover:bg-surface-container-lowest hover:border-primary/20 ambient-shadow transition-all duration-300 bg-surface-container-lowest focus:ring-2 focus:ring-primary/40 focus:outline-none intelligence-ray">
<div class="bg-surface-container-highest p-3 rounded-lg mr-5 group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-primary text-[22px]" data-icon="insights">insights</span>
</div>
<div class="flex-grow">
<h3 class="font-headline font-semibold text-on-surface text-base">Manage spending better</h3>
<p class="text-on-surface-variant text-xs mt-0.5">Gain granular control over daily cash flow and budgeting.</p>
</div>
<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 text-primary transition-opacity text-[20px]" data-icon="check_circle">check_circle</span>
</button>
</div>
</div>
<!-- Reduced bottom spacer for more professional vertical rhythm -->
<div class="h-24 w-full"></div>
</main>
<!-- Bottom Navigation (Shell Implementation) -->
<footer class="fixed bottom-0 left-0 w-full py-6 px-6 bg-gradient-to-t from-background via-background/90 to-transparent z-50">
<div class="w-full max-w-3xl mx-auto flex justify-between items-center">
<!-- Back Action -->
<button class="flex items-center justify-center text-on-surface-variant px-4 py-2 font-body text-xs font-semibold tracking-wide uppercase hover:text-primary transition-colors active:translate-y-0.5">
<span class="material-symbols-outlined mr-2 text-[18px]" data-icon="arrow_back">arrow_back</span>
        Back
      </button>
<!-- Primary Action: Complete Analysis -->
<button class="flex items-center justify-center bg-gradient-to-r from-[#006B5F] to-[#14B8A6] text-white rounded-lg px-8 py-3.5 shadow-md shadow-primary/20 font-body text-xs font-bold tracking-widest uppercase hover:brightness-110 transition-all active:scale-[0.98]">
        Complete Analysis
        <span class="material-symbols-outlined ml-2 text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
</body></html>
