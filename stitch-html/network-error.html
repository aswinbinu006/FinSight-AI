<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-fixed": "#0b1c30",
              "secondary-fixed-dim": "#bec6e0",
              "primary-fixed-dim": "#4fdbc8",
              "primary-fixed": "#71f8e4",
              "on-surface-variant": "#3c4947",
              "background": "#f5fbfa",
              "tertiary-container": "#95a5be",
              "on-secondary-container": "#5c647a",
              "on-error": "#ffffff",
              "outline-variant": "#bbcac6",
              "on-error-container": "#93000a",
              "on-secondary-fixed-variant": "#3f465c",
              "surface-container-highest": "#dee4e3",
              "error": "#ba1a1a",
              "tertiary-fixed": "#d3e4fe",
              "surface-variant": "#dee4e3",
              "secondary-fixed": "#dae2fd",
              "primary": "#006b5f",
              "on-secondary-fixed": "#131b2e",
              "on-primary-fixed-variant": "#005048",
              "surface-container-low": "#eff5f4",
              "secondary": "#565e74",
              "outline": "#6c7a77",
              "tertiary": "#505f76",
              "on-tertiary": "#ffffff",
              "surface-container-high": "#e3e9e8",
              "on-primary-fixed": "#00201c",
              "error-container": "#ffdad6",
              "on-primary": "#ffffff",
              "surface-container-lowest": "#ffffff",
              "primary-container": "#14b8a6",
              "surface-dim": "#d5dbda",
              "on-surface": "#171d1c",
              "inverse-primary": "#4fdbc8",
              "inverse-on-surface": "#ecf2f1",
              "secondary-container": "#dae2fd",
              "on-tertiary-container": "#2b3b50",
              "on-background": "#171d1c",
              "inverse-surface": "#2b3231",
              "on-secondary": "#ffffff",
              "on-primary-container": "#00423b",
              "surface-tint": "#006b5f",
              "surface-bright": "#f5fbfa",
              "on-tertiary-fixed-variant": "#38485d",
              "surface-container": "#e9efee",
              "tertiary-fixed-dim": "#b7c8e1",
              "surface": "#f5fbfa"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 48;
      }
      .bg-radial-intelligence {
        background: radial-gradient(circle at center, #eff5f4 0%, #f5fbfa 100%);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
      }
      .text-watermark {
        user-select: none;
        pointer-events: none;
      }
    </style>
</head>
<body class="font-body bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-6 bg-radial-intelligence overflow-hidden">
<!-- Large Faint Background Element -->
<div class="fixed inset-0 flex items-center justify-center text-watermark opacity-[0.03] overflow-hidden">
<span class="material-symbols-outlined scale-[15] select-none" data-icon="cloud_off">cloud_off</span>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-md flex flex-col items-center text-center">
<!-- Visual Icon Section -->
<div class="relative mb-12">
<!-- Glow Effect -->
<div class="absolute inset-0 bg-primary-container/20 blur-[100px] rounded-full scale-150"></div>
<div class="relative flex items-center justify-center w-32 h-32 rounded-full bg-surface-container-lowest glass-card shadow-[0_8px_32px_rgba(0,107,95,0.08)]">
<span class="material-symbols-outlined text-primary text-6xl" data-icon="wifi_off">wifi_off</span>
</div>
<!-- Minimal connectivity accent -->
<div class="absolute -right-2 top-0 w-3 h-3 rounded-full bg-error animate-pulse opacity-40"></div>
</div>
<!-- Typography Content -->
<div class="space-y-4 mb-10">
<h1 class="text-3xl font-semibold text-on-surface tracking-tight">
                You're offline
            </h1>
<p class="text-base text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
                Check your internet connection and try again.
            </p>
</div>
<!-- Action Section -->
<div class="w-full flex flex-col items-center gap-12">
<button class="px-12 py-3.5 bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-semibold rounded-full shadow-lg shadow-primary/20 transition-all duration-300 active:scale-95" onclick="window.location.reload()">
                Retry
            </button>
<!-- Very subtle branding at the far bottom -->
<div class="opacity-30">
<p class="text-[10px] font-medium uppercase tracking-[0.2em] text-outline">
                    Institutional Intelligence
                </p>
</div>
</div>
</main>
<!-- Visual Texture Element -->
<div class="fixed bottom-0 right-0 p-16 opacity-[0.07] pointer-events-none hidden lg:block">
<svg fill="none" height="300" viewbox="0 0 200 200" width="300" xmlns="http://www.w3.org/2000/svg">
<circle class="text-primary" cx="100" cy="100" r="99.5" stroke="currentColor" stroke-dasharray="8 8"></circle>
</svg>
</div>
</body></html>
