<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>500 Server Error | FinSight AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006b5f",
                        "primary-container": "#14b8a6",
                        "on-primary": "#ffffff",
                        "on-surface": "#171d1c",
                        "on-surface-variant": "#3c4947",
                        "surface": "#f5fbfa",
                        "surface-container": "#e9efee",
                        "outline-variant": "#bbcac6",
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "serif-display": ["Newsreader", "serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .error-bg-text {
            user-select: none;
            pointer-events: none;
            opacity: 0.05;
        }
        .bg-soft-gradient {
            background: linear-gradient(135deg, #F2F8F7 0%, #E6F3F1 100%);
        }
        .btn-shadow {
            box-shadow: 0 4px 12px rgba(0, 107, 95, 0.12);
        }
    </style>
</head>
<body class="bg-soft-gradient min-h-screen flex items-center justify-center font-body selection:bg-primary-container/30 selection:text-on-primary-container overflow-hidden">
<!-- Large Faint Background Text -->
<div class="fixed inset-0 flex items-center justify-center pointer-events-none">
<span class="error-bg-text font-serif-display text-[30rem] md:text-[45rem] font-light leading-none">500</span>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-2xl px-6 text-center">
<!-- Minimal Logo -->
<div class="mb-12 flex justify-center">
<div class="flex items-center gap-2 opacity-80">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="analytics">analytics</span>
<span class="text-lg font-semibold tracking-tight text-on-surface">FinSight AI</span>
</div>
</div>
<!-- Text Stack -->
<div class="space-y-6">
<h1 class="text-4xl md:text-5xl font-headline font-semibold text-on-surface tracking-tight">
                500 — Something went wrong
            </h1>
<p class="text-lg md:text-xl text-on-surface-variant font-light max-w-lg mx-auto leading-relaxed">
                We're having trouble processing your request. This is likely a temporary issue on our side.
            </p>
</div>
<!-- Action Cluster -->
<div class="mt-12 flex flex-col sm:flex-row items-center justify-center gap-4">
<button class="w-full sm:w-auto px-10 py-4 bg-primary text-white font-medium rounded-lg btn-shadow hover:bg-primary/90 hover:scale-[1.02] active:scale-[0.98] transition-all">
                Try again
            </button>
<button class="w-full sm:w-auto px-10 py-4 text-on-surface font-medium rounded-lg hover:bg-on-surface/5 transition-colors border border-outline-variant/30">
                Go to Dashboard
            </button>
</div>
<!-- Subtle System Status Link -->
<div class="mt-20">
<a class="inline-flex items-center gap-2 text-sm text-on-surface-variant/60 hover:text-primary transition-colors font-medium" href="#">
<span class="material-symbols-outlined text-base" data-icon="status_alert">add_alert</span>
                Check system status
            </a>
</div>
</main>
<!-- Footer Metadata -->
<footer class="fixed bottom-8 w-full text-center">
<p class="text-[0.6875rem] font-medium uppercase tracking-[0.08em] text-on-surface-variant/30">
            Internal Server Error • Ref: AI-FS-9921
        </p>
</footer>
